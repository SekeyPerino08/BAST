name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
      INTEGRATION_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: test-only-ci-secret-with-at-least-sixty-four-characters
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: password123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run prisma:generate
        working-directory: backend
      - run: npm run prisma:migrate:deploy
        working-directory: backend
      - run: npm run seed
        working-directory: backend
      - run: npm run test:ci
        working-directory: backend
